<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MND-N Links</title>

<style>
:root{
  --bg:#0f1a10;
  --gap:2px;
  --btnPad:4px;

  /* Kopējais rāmis visām sociālo tīklu rindām */
  --rowX:19.25%;
  --rowW:63.30%;
  --rowH:4.95%;
}

html,body{
  margin:0;
  height:100%;
  background:var(--bg);
  display:grid;
  place-items:center;
}

.stage{
  position:relative;
  aspect-ratio:785/2048;
  width:min(100vw, calc(100vh * (785/2048)));
  height:min(100vh, calc(100vw * (2048/785)));
}

.bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
}

.zona{
  position:absolute;
}

/* POST augšā */
.zona-1-link{
  top:-0.4%;
  left:29.1%;
  width:52.7%;
  height:15.2%;
  border-radius:6px;
  overflow:hidden;
}

.zona-1-img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/*
  VISĀM RINDĀM VIENĀDS 5 KOLONNU REŽĢIS.
  Tādēļ visas pogas ir vienāda izmēra kā MNB-LVA un MIBDE rindās.
*/
.pogu-rinda{
  display:grid;
  grid-template-columns:repeat(5, minmax(0, 1fr));
  grid-template-rows:1fr;
  gap:var(--gap);
  padding:var(--btnPad);
  box-sizing:border-box;
  width:100%;
  height:100%;
}

.pogu-rinda a{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
}

.social-btn{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  border-radius:12px;
  filter:drop-shadow(2px 4px 6px rgba(0,0,0,.5));
  transition:.18s ease;
}

.social-btn:hover{
  transform:scale(1.05);
}

/* 3 pogas: aizņem 3., 4. un 5. kolonnu — nolīdzinātas pa labi */
.align-right-3 a:nth-child(1){grid-column:3;}
.align-right-3 a:nth-child(2){grid-column:4;}
.align-right-3 a:nth-child(3){grid-column:5;}

/* 2 pogas: aizņem 4. un 5. kolonnu — nolīdzinātas pa labi */
.align-right-2 a:nth-child(1){grid-column:4;}
.align-right-2 a:nth-child(2){grid-column:5;}

/* Precīzās rindu pozīcijas jaunajam 785 × 2048 fonam */
.zona-2{
  top:24.95%;
  left:var(--rowX);
  width:var(--rowW);
  height:var(--rowH);
}

.zona-3{
  top:39.35%;
  left:var(--rowX);
  width:var(--rowW);
  height:var(--rowH);
}

.zona-4{
  top:53.63%;
  left:var(--rowX);
  width:var(--rowW);
  height:var(--rowH);
}

.zona-5{
  top:67.93%;
  left:var(--rowX);
  width:var(--rowW);
  height:var(--rowH);
}

.zona-6{
  top:82.24%;
  left:var(--rowX);
  width:var(--rowW);
  height:var(--rowH);
}

/* Debug režīms, ja vajag redzēt klikšķināmās zonas */
/*
.zona-1-link,.zona-2,.zona-3,.zona-4,.zona-5,.zona-6{
  outline:2px solid red;
}
*/
@media (max-width:600px){

  html,body{
    height:auto;
    min-height:100%;
    display:block;
    overflow-x:hidden;
  }

  .stage{
    width:100vw;
    height:calc(100vw * 3190 / 1223);
    margin:0 auto;
  }
}
</style>
</head>
